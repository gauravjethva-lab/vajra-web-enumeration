name: 🐛 Bug Report
description: Report a bug or unexpected behavior in VAJRA
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below.

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g. Kali Linux 2024.1
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python Version
      placeholder: e.g. Python 3.11.2
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 🐛 Bug Description
      description: What happened? What did you expect to happen?
      placeholder: Describe the bug clearly...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 🔁 Steps to Reproduce
      placeholder: |
        1. Run `python3 main.py`
        2. Enter domain...
        3. Error appears...
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 💥 Error Output
      description: Paste the full error message or traceback
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: ✅ Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I am using this tool legally and ethically
          required: true
